[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forkbox"
version = "0.1.0"
authors = [
  { name = "Matheus Delgado", email = "matheus@example.com" },
]
description = "Deterministic, ultra-low latency execution sandbox for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[tool.setuptools.packages.find]
where = ["python"]